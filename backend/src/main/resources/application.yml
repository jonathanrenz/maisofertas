spring:
  application:
    name: maisofertas-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:maisofertas}
    username: ${DB_USER:maisofertas}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  deals:
    dedup-window-days: ${DEAL_DEDUP_WINDOW_DAYS:7}
  publish:
    interval-ms: ${PUBLISH_INTERVAL_MS:300000}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5-nano}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  evolution:
    base-url: ${EVOLUTION_BASE_URL:http://localhost:8080}
    instance: ${EVOLUTION_INSTANCE:maisofertas}
    api-key: ${EVOLUTION_API_KEY:}
    group-jid: ${EVOLUTION_GROUP_JID:}
  amazon:
    associate-tag: ${AMAZON_ASSOCIATE_TAG:}
  canopy:
    base-url: ${CANOPY_BASE_URL:https://rest.canopyapi.co}
    api-key: ${CANOPY_API_KEY:}
    domain: ${CANOPY_DOMAIN:BR}
    min-discount-percent: ${CANOPY_MIN_DISCOUNT_PERCENT:20}
    sync:
      enabled: ${CANOPY_SYNC_ENABLED:false}
      interval-ms: ${CANOPY_SYNC_INTERVAL_MS:28800000}
      pages-per-run: ${CANOPY_SYNC_PAGES_PER_RUN:1}
  shopee:
    base-url: ${SHOPEE_BASE_URL:https://open-api.affiliate.shopee.com.br/graphql}
    app-id: ${SHOPEE_APP_ID:}
    secret: ${SHOPEE_SECRET:}
    keyword: ${SHOPEE_KEYWORD:}
    sort-type: ${SHOPEE_SORT_TYPE:5}
    min-discount-percent: ${SHOPEE_MIN_DISCOUNT_PERCENT:20}
    sync:
      enabled: ${SHOPEE_SYNC_ENABLED:false}
      interval-ms: ${SHOPEE_SYNC_INTERVAL_MS:28800000}
      pages-per-run: ${SHOPEE_SYNC_PAGES_PER_RUN:1}
      limit-per-page: ${SHOPEE_SYNC_LIMIT_PER_PAGE:20}
